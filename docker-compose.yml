services:

  kafka:
    image: apache/kafka:latest
    container_name: rta_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:29092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 15

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: rta_kafka_ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  jupyter:
    image: jupyterlab-project-jupyter:latest
    container_name: rta_jupyter
    ports:
      - "8888:8888"
    environment:
      JUPYTER_TOKEN: "rta"
      JUPYTER_ENABLE_LAB: "yes"
    volumes:
      - .:/home/jovyan/work
    working_dir: /home/jovyan/work
    command: start-notebook.py --NotebookApp.token=rta --NotebookApp.notebook_dir=/home/jovyan/work
    depends_on:
      kafka:
        condition: service_healthy

  influxdb:
    image: influxdb:2.7
    container_name: rta_influxdb
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: adminadmin
      DOCKER_INFLUXDB_INIT_ORG: rta
      DOCKER_INFLUXDB_INIT_BUCKET: fraud_alerts
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: rta-super-secret-token
    volumes:
      - influxdb_data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 15

  data-generator:
    image: python:3.11-slim
    container_name: rta_data_generator
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
    volumes:
      - .:/app
    working_dir: /app/data_generator
    command: >
      bash -c "pip install kafka-python --quiet && python generator.py --rate 50 --fraud 0.10 --bootstrap kafka:29092"
    restart: unless-stopped

  spark-job:
    image: jupyterlab-project-jupyter:latest
    container_name: rta_spark
    depends_on:
      kafka:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      FRAUD_THRESHOLD: "0.87"
      PYTHONPATH: /home/jovyan/work/.packages
    volumes:
      - .:/home/jovyan/work
    working_dir: /home/jovyan/work
    entrypoint: ["bash", "-c"]
    command:
      - "[ -d /home/jovyan/work/.packages/xgboost ] || pip install xgboost kafka-python --target=/home/jovyan/work/.packages --quiet; spark-submit --packages org.apache.spark:spark-sql-kafka-0-10_2.13:4.0.0 --conf spark.jars.ivy=/tmp/.ivy2 spark_job/fraud_detector.py"
    restart: unless-stopped

  alert-bridge:
    image: python:3.11-slim
    container_name: rta_alert_bridge
    depends_on:
      kafka:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: rta-super-secret-token
      INFLUX_ORG: rta
      INFLUX_BUCKET: fraud_alerts
    volumes:
      - .:/app
    working_dir: /app
    command: >
      bash -c "pip install kafka-python influxdb-client --quiet && python3 alert_bridge.py"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: rta_grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: "grafana-worldmap-panel"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      influxdb:
        condition: service_healthy
    restart: unless-stopped

volumes:
  kafka_data:
  influxdb_data:
  grafana_data: